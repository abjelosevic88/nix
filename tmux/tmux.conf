# --- General Settings ---
unbind C-b
bind C-a send-prefix
set -g status-position top
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Support images
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# System clipboard (OSC 52): accept OSC 52 from apps (e.g. Neovim) and forward
# it to the outer terminal's clipboard. Required for yanks to reach the local
# machine's clipboard over SSH, where there is no X/Wayland display.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# bind windows navigation
# Cmd+Shift+H/L mapped via terminal emulator sending custom escape sequences
bind-key -n M-H previous-window
bind-key -n M-L next-window

# New window: place after current, start in $HOME
bind c new-window -a -c "$HOME"

# The status bar and Continuum settings live in the Continuum plugin's
# extraConfig in home/common.nix. They must be defined before the plugin loads
# so its periodic-save command remains embedded in status-right.
